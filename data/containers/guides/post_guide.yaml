  - type: text
    content: "## 🍹發布貼文時需要注意什麼?"

  - type: separator

  - type: section
    content: |
      發布新貼文時請寫上明確的遊戲名稱作為標題即可，標語可接受空白，有餘力的話還請附上相關貼圖幫助列表美化；若仍不清楚如何發布或不好意思自行發布時，也可以請管理員幫忙發布。小酒館允許發布有討論空間的限制級遊戲貼文。

      貼文者對貼文有最高權利，可自行或請求管理員執行相關操作，比如編輯貼文、刪除違規留言等等；不過，社群對貼文仍保有部分修改權，若標題難以辨認確切的遊戲款式、標籤不完全符合規定、基於社群變更而需要對整體進行調整時，管理員有權進行相應程度的修改。

      小酒館是專用於建立遊戲討論頻道的地方，如果旅人想發布或查看其他主題的貼文，請參考：
      
      - <#1190043435009331230>
      - <#1211637177918947378>
      - <#1208340272027664404>
