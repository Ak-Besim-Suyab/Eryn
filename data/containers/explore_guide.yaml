  - type: text
    content: "### 🔥 保持活躍"

  - type: section
    content: |
      社群有獨特的經驗等級系統用於保持與鼓勵旅人在此活躍，旅人可以通過發送訊息、按表情或進入語音頻道等伺服器活動，或者進行簽到、遊玩機器人遊戲等額外行動累積經驗。社群對活躍度的要求非常寬鬆，旅人無須為此感到壓力；社群很鼓勵大家低能量社交，偶爾露臉也沒問題！
    accessory:
      type: thumbnail
      media: https://cdn.discordapp.com/attachments/1491046495812718672/1508877794401189959/black_cat_onfire.jpg

  - type: action_row
    components:
      - type: button
        label: 每日簽到
        emoji: 🎁
        url: https://discord.com/channels/1190027756482859038/1472379536187326464

  - type: separator

  - type: text
    content: "### 👻 介紹自己"

  - type: section
    content: |
      旅人可以從身分組問卷選擇自己感興趣的遊戲與話題，讓大家在舉辦或參加活動時能即時提及您；您還可以套用外觀身分組來裝扮自己，讓自己擁有獨特風格。社群也推薦旅人到自我介紹寫下更多關於自己的事情，讓大家能更好地認識您！
    accessory:
      type: thumbnail
      media: https://cdn.discordapp.com/attachments/1491046495812718672/1509037731475357866/cat_disguise.jpg

