  - type: text
    content: "## 準備好開始探索 🚀"
  
  - type: separator

  - type: text
    content: "### 💬 從文字開始"

  - type: section
    content: |
      旅人剛開始會感到不好意思也沒關係，大家其實都相對慢熟，您可以先從文字聊天開始尋找或等待感興趣的遊戲與話題並嘗試加入。此外社群也推薦旅人隨時加入公開的語音頻道，即使不說話也沒關係，多聆聽大家的聊天話題來慢慢增加熟悉感！

      這裡有許多主題豐富的頻道與貼文供旅人探索，若旅人不好意思在主要頻道說話，也非常歡迎從這些貼文開始喔！
    accessory:
      type: thumbnail
      media: https://cdn.discordapp.com/attachments/1491046495812718672/1522680802528333934/over_the_garden_wall.jpg

