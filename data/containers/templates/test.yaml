      ## 《Th Haven》目錄
      > *旅人將化身為旅行者，跟隨大批逃難者搭乘渡船前往逐漸復興的北方港，你可以選擇參與新紀元的重建，或者發掘舊紀元毀滅的秘密。*

      歡迎旅人來到遊戲目錄，你可以在這裡查看關於遊戲的部分詳細資訊。

      這是款以整個社群為框架驅動的角色扮演遊戲，旅人從進入起就將隨著相關的聯動功能開始體驗。本遊戲僅屬於社群附屬功能，並不強制任何人遊玩，旅人可根據個人興趣自由決定是否遊玩。