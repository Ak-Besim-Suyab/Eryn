items:
  - type: text
    content: "## 歡迎來到避風港，這裡是旅居手冊 🎉"

  - type: section
    content: |
      歡迎旅人來到這個溫暖、可愛的小地方，這裡是以遊戲、動漫與電影為主要內容，同時也包含非常多生活相關主題的 ACG 社群。
      
      在開始您的旅途之前，希望您可以花點時間閱讀這份手冊，這裡有許多重要的社群資訊與使用方式，能幫助您快速瞭解社群。
      
      > 查看下列特點時，點擊「詳情」可引導至相關網頁以瞭解更多內容。
    accessory:
        type: thumbnail
        media: https://cdn.discordapp.com/attachments/1491046495812718672/1521391664642658314/broken_map.jpg

  - type: separator

  - type: section
    content: |
      ### 📜 社群守則
      開始活動前，請務必先閱讀社群相關規定。社群的規定不多，大部分都是個人權益與安全宣導，希望大家都能共同維護友善社群！
    accessory:
      type: button
      label: 詳情
      emoji: 🌐
      url: https://discord.com/channels/1190027756482859038/1509068887768174633

  - type: separator

  - type: section
    content: |
      ### 💡 頻道索引
      社群有非常完善的頻道與分類供大家自由使用，以及多種有趣且實用的功能，還有專門為社群編寫的 Discord Bot！
    accessory:
      type: button
      label: 詳情
      emoji: 🌐
      url: https://discord.com/channels/1190027756482859038/1208117274037190686

  - type: separator

  - type: section
    content: |
        ### 🏕️ 個人小屋
        社群擁有非常特別的共同經營模式，每位旅人都能擁有屬於自己的語音頻道，以及該頻道的所有權限。您可以自由裝飾、布置、並邀請最好的朋友加入遊玩！
    accessory:
      type: button
      label: 詳情
      emoji: 🌐
      url: https://discord.com/channels/1190027756482859038/1209461581998592021