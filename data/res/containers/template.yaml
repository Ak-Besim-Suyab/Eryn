
# :: items
#   - 元件清單, 所有 Discord 的 ui.Item 物件都將以清單內的字典格式傳入, 並透過資料物件將其轉換為對應的元件資訊
#     清內的 `type` 屬性用於判斷元件類別
#   
#   ::: accessory type: button - 對應 ui.Button 元件, label 為按鈕標題 (預設為空), url 為按鈕連結 (預設為空), emoji 為按鈕表情符號 (預設為空)
#   ::: accessory type: thumbnail - 對應 ui.Thumbnail 元件, media 為縮圖連結 (必須填寫) 
#

accent_color: 0 # 視圖左邊邊框的顏色, 預設為 0 (不顯示)

items: # 元件清單

  # 該類型對應 ui.Section 元件, 該元件包含 content 與 accessory 兩個元素
  # content 為文本內容, 預設為空字串
  # 該元件必定附帶 accessory, 必須填寫任一附件否則該元件將會報錯, 只有單純的文本請改用 text
  # 附件僅支持 button 和 thumbnail, 且只能擇一項目填寫無法同時存在

  - type: section
    content: | 
      # Section test
      this is a section test with a thumbnail.
    accessory:
      type: thumbnail
      media: https://cdn.discordapp.com/attachments/1491046495812718672/1509438153444819145/coffee_cropped.png

  # 該類型對應 ui.Separator 元件
  # size: 分隔線的大小 (預設為 large, 可以設定為 small, 選填)
  # visible: 是否顯示分隔線 (預設為 true, 可以設定為 false, 選填)

  - type: separator 
    size: large
    visible: true

  - type: section
    content: |
      # Section test
      this is a section test with a button, and also a duplicated section test.
    accessory:
      type: button
      label: Google
      url: https://google.com

  - type: separator

  # 該類型對應 ui.TextDisplay 元件
  # content: 文本內容（預設為空字串）

  - type: text
    content: |
      # Plain test
      test nothing.

  - type: separator

  - type: text
    content: |
      # Button test
      there is an action row below.

  - type: action_row
    components:
      - type: button
        style: primary
        label: Google
        url: https://google.com

      - type: button
        style: secondary
        label: Discord
        url: https://discord.com

      - type: button
        style: secondary
        label: Test Button
        custom_id: button_test

  - type: separator

  - type: text
    content: |
      # Select test
      there is an select in action row below.

  - type: select
    placeholder: Please select an option!
    min_values: 1
    max_values: 1
    custom_id: select_unique_role
    options:
      - label: Option 1
        description: This is Option 1
        emoji: 🎉
        value: baked_potato
      - label: Option 2
        description: This is Option 2
        emoji: 🎉
        value: 2