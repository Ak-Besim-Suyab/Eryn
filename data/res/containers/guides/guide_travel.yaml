  - type: text
    content: "## 歡迎來到避風港，這裡是旅居手冊 🎉"

  - type: section
    content: |
      歡迎旅人來到這個溫暖、可愛的小地方，這裡是以遊戲和動漫電影為主要內容，同時也包含非常多生活主題與高度個人化的 ACG 社群！
      
      在旅途開始前希望旅人可以花點時間閱讀這份手冊，手冊裡有許多重要的社群資訊與使用說明以便幫助您快速瞭解這裡！
      
      > 點擊下列右方的「詳情」按鈕將引導至說明頁面。
    accessory:
        type: thumbnail
        media: https://cdn.discordapp.com/attachments/1491046495812718672/1521391664642658314/broken_map.jpg

