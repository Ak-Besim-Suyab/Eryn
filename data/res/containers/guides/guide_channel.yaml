    content: |
      ## 頻道索引 💡
      社群有非常多實用的頻道提供大家自由使用，每個頻道都有對應的主題或使用方式，發送訊息或貼文前請記得查看頂部資訊、置頂訊息或本篇說明。

  - type: separator

  - type: section
    content: |
      ### 🍁 露營地
      露營地是生活頻道分類，日常主題與非遊戲主題會歸類在這裡，旅人可以在這些頻道和大家聊日常，分享喜歡的事物，發送有趣的內容，或者傾訴自己的煩惱，不論任何話題都非常歡迎！

