  - type: separator

  - type: section
    content: |
      ### 🎥 海百合劇院
      海百合劇院是影視頻道分類，旅人可以在這裡和大家討論喜歡或感興趣的動畫、漫畫、電影等各種形式的影視作品；除此之外，社群成員偶爾也會自發性舉辦動畫或電影的放映活動，非常歡迎大家來同樂。
      
      - <#1387744964334587994>
      - <#1224231424433852446>
      - <#1251845986804961340>
    accessory:
      type: thumbnail
      media: https://cdn.discordapp.com/attachments/1491046495812718672/1509266166772928713/aquarium_cropped.png

  - type: separator

  - type: section
    content: |
      ### 🍻 海岸線旁
      海岸線旁是公用的語音頻道分類，旅人可以隨時隨地進來這裡，您可以在這邊掛網、邀請親朋好友進來聊天，也可以舉辦各式各樣的活動！
      
      - <#1296063137962786846>
      - <#1296893788148600913>
    accessory:
      type: thumbnail
      media: https://cdn.discordapp.com/attachments/1491046495812718672/1509428048704045147/strees_cropped.png

  - type: separator

  - type: section
    content: |
      ### ☕ 寧靜街道
      寧靜街道是特別給喜歡安靜氛圍的人準備的頻道分類，寧靜街道裡的頻道皆設定為無法打開麥克風說話，您不會被突如其來的語音打擾，非常適合旅人和小夥伴們在這裡掛網、讀書、工作和創作。
      
      - <#1223878258983047209>
      - <#1393199318726344704>
    accessory:
      type: thumbnail
      media: https://cdn.discordapp.com/attachments/1491046495812718672/1509438153444819145/coffee_cropped.png