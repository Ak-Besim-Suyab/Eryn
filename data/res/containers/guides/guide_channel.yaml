  - type: separator

  - type: section
    content: |
      ### 🌳 森林裡
      幽靜的自然深處，坐落著最適合旅人放鬆身心的建築物，這裡是提供給大家拓展個人空間的頻道分類，您可以在這裡領取屬於自己的貼文，和大家成為鄰居；不定期舉辦個小茶會和大家聊天，或建立紀念冊和大家共同編輯在這裡的各種回憶。

      - <#1539954932776443944>
      - <#1211637177918947378>
    accessory:
      type: thumbnail
      media: https://cdn.discordapp.com/attachments/1491046495812718672/1561053676578017441/in_the_forest.jpg

  - type: separator

  - type: section
    content: |
      ### ⚓ 避風港與河道
      避風港是遊戲頻道分類，與遊戲有關的主題會歸類在這裡，旅人可以在這裡和大家討論或分享任何遊戲資訊；社群也有安排幾個小遊戲機器人，平常無聊的話也可以在社群裡玩小遊戲。

      河道則是將討論度較高的遊戲分出來做為單獨的分類，讓大家可以更方便地討論特定主題、整理與找查資料。大部分頻道都有身分組限制，想加入討論的話請務必領取身分組哦！
      
      - <#1442186516351680522>
      - <#1192490635266109530>
      - <#1226069418170257503>
